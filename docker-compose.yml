version: '3.8'

services:
  # PostgreSQL データベース
  db:
    image: postgres:15-alpine
    container_name: vehicle-sales-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: vehicle_sales_db
      # 日本語タイムゾーン設定
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      # データの永続化
      - postgres_data:/var/lib/postgresql/data
      # 初期化スクリプトの実行
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vehicle_sales_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vehicle-sales-network

  # pgAdmin - PostgreSQL 管理ツール（オプション）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vehicle-sales-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - vehicle-sales-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  vehicle-sales-network:
    driver: bridge